[package]
name = "fasteetf"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "LGPL-3.0-or-later"
keywords = ["erlang", "eetf", "parser", "serializer", "deserializer"]
repository = "https://github.com/MuntasirSZN/fasteetf"
categories = ["embedded", "encoding", "no-std", "no-std::no-alloc", "parser-implementations"]
description = "A extremely fast, rust-based, no-std EETF (Erlang External Term Format) parser/encoder/(de)serializer"
homepage = "https://github.com/MuntasirSZN/fasteetf"
include = ["/src", "LICENSE", "/examples", "/benches"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std", "compression", "zlib-rs"]
alloc = [
  "serde_core?/alloc",
  "miniz_oxide?/with-alloc",
  "zlib-rs?/rust-allocator",
]
std = [
  "alloc",
  "thiserror/std",
  "serde_core?/std",
  "zlib-rs?/std",
  "miniz_oxide?/std",
]
compression = []
serde = ["dep:serde_core", "alloc"]
zlib-rs = ["dep:zlib-rs"]
miniz_oxide = ["dep:miniz_oxide"]
zlib = ["dep:libz-sys"]
zlib-default = ["dep:libz-sys", "libz-sys?/default"]
zlib-ng-compat = ["dep:libz-sys", "libz-sys?/zlib-ng"]
zlib-ng = ["dep:libz-ng-sys"]
cloudflare-zlib = ["dep:cloudflare-zlib-sys"]

[dependencies]
serde_core = { version = "1", default-features = false, optional = true }
thiserror = { version = "2", default-features = false }
zlib-rs = { version = "0.6.3", default-features = false, features = [
  "vpclmulqdq",
  "avx512",
], optional = true }
miniz_oxide = { version = "0.9.1", default-features = false, optional = true, features = [
  "simd",
] }
libz-sys = { version = "1.1.20", default-features = false, features = ["libc"], optional = true }
libz-ng-sys = { version = "1.1.16", default-features = false, optional = true }
cloudflare-zlib-sys = { version = "0.3.6", optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
cpufeatures = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
divan = { version = "5.0.1", package = "codspeed-divan-compat" }
proptest = "1"

[target.'cfg(kani_ra)'.dev-dependencies]
kani = { git = "https://github.com/model-checking/kani" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
serde_json = "1"
zlib-rs = { version = "0.6.3", default-features = false, features = [
  "vpclmulqdq",
  "avx512",
  "rust-allocator",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[[bench]]
name = "parse"
harness = false
required-features = ["std"]

[[test]]
name = "parse"
path = "tests/parse/mod.rs"
required-features = ["alloc"]

[[test]]
name = "encoding"
path = "tests/encoding/mod.rs"
required-features = ["alloc"]

[[test]]
name = "compression"
path = "tests/compression/mod.rs"
required-features = ["alloc", "compression"]

[[test]]
name = "streaming"
path = "tests/streaming/mod.rs"
required-features = ["alloc"]

[[test]]
name = "limits"
path = "tests/limits/mod.rs"
required-features = ["alloc"]

[[test]]
name = "visitor"
path = "tests/visitor/mod.rs"
required-features = ["alloc"]

[[test]]
name = "serde"
path = "tests/serde/mod.rs"
required-features = ["serde"]

[[test]]
name = "proptest"
path = "tests/proptest.rs"
required-features = ["alloc"]
