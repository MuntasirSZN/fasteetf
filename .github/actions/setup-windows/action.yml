
name: Setup Windows
description: >-
  Enable Git long paths. With the `asan` input set to `true`, also add the
  matching MSVC AddressSanitizer runtime DLL directory to PATH.

inputs:
  asan:
    description: Add the MSVC AddressSanitizer runtime DLL directory to PATH
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Enable Git long paths
      shell: powershell
      run: git config --system core.longpaths true

    - name: Add matching ASan DLL to PATH
      if: inputs.asan == 'true'
      shell: powershell
      run: | # zizmor: ignore[github-env] This is not attacker controlled
        $ErrorActionPreference = 'Stop'

        $vswhere = Join-Path ${env:ProgramFiles(x86)} `
          'Microsoft Visual Studio\Installer\vswhere.exe'

        if (-not (Test-Path -LiteralPath $vswhere)) {
          throw "vswhere not found: $vswhere"
        }

        $installPath = & $vswhere -latest -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath

        if (-not $installPath) {
          throw "No Visual Studio installation with VC tools found"
        }

        $toolsetRoot = Join-Path $installPath 'VC\Tools\MSVC'

        # Read the default MSVC toolset version instead of selecting
        # an arbitrary installed version.
        $versionFile = Join-Path $installPath `
          'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt'

        $toolsetVersion = $null

        if (Test-Path -LiteralPath $versionFile) {
          $toolsetVersion = (Get-Content -LiteralPath $versionFile -Raw).Trim()
        }

        if ($toolsetVersion) {
          $toolsetDir = Join-Path $toolsetRoot $toolsetVersion

          if (-not (Test-Path -LiteralPath $toolsetDir)) {
            throw "Default MSVC toolset $toolsetVersion is not installed: $toolsetDir"
          }
        }
        else {
          # Fallback for installations without the default version file.
          $toolsetDir = Get-ChildItem -LiteralPath $toolsetRoot -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $toolsetDir) {
            throw "No MSVC toolsets found under $toolsetRoot"
          }

          $toolsetVersion = Split-Path -Leaf $toolsetDir
        }

        $toolsetBinDir = Join-Path $toolsetDir 'bin\HostX64\x64'

        $asanDll = Join-Path $toolsetBinDir `
          'clang_rt.asan_dynamic-x86_64.dll'

        $linker = Join-Path $toolsetBinDir 'link.exe'
        $dumpbin = Join-Path $toolsetBinDir 'dumpbin.exe'

        foreach ($path in @($asanDll, $linker, $dumpbin)) {
          if (-not (Test-Path -LiteralPath $path)) {
            throw "Required MSVC toolchain file not found: $path"
          }
        }

        # Make sure the DLL exports the function required by the
        # Rust/libFuzzer ASan thunk.
        $exports = & $dumpbin /nologo /exports $asanDll 2>&1 |
          Out-String

        if ($LASTEXITCODE -ne 0) {
          throw "Failed to inspect ASan DLL exports: $asanDll"
        }

        if ($exports -notmatch '(?m)\b__sanitizer_weak_hook_memcmp\b') {
          throw @"
        The MSVC ASan runtime does not export __sanitizer_weak_hook_memcmp.

        Toolset: $toolsetVersion
        DLL: $asanDll

        Update the MSVC toolset to a compatible version.
        "@
        }

        # Put the matching MSVC tools and ASan runtime ahead of Git's
        # usr\bin directory so link.exe resolves to the actual MSVC linker.
        Add-Content -Path $env:GITHUB_PATH -Value $toolsetBinDir

        Write-Host "MSVC toolset: $toolsetVersion"
        Write-Host "MSVC linker: $linker"
        Write-Host "ASan runtime: $asanDll"
        Write-Host "Verified export: __sanitizer_weak_hook_memcmp"

