
name: Setup Windows
description: >-
  Enable Git long paths. With the `asan` input set to `true`, also add the
  matching MSVC AddressSanitizer runtime DLL directory to PATH.

inputs:
  asan:
    description: Add the MSVC AddressSanitizer runtime DLL directory to PATH
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Enable Git long paths
      shell: powershell
      run: git config --system core.longpaths true

    - name: Add matching ASan DLL to PATH
      if: inputs.asan == 'true'
      shell: powershell
      run: | # zizmor: ignore[github-env] This is not attacker controlled
        $ErrorActionPreference = 'Stop'

        $asanDllName = 'clang_rt.asan_dynamic-x86_64.dll'

        # Prefer the runtime beside the linker that Rust will use.
        $linker = Get-Command link.exe `
          -CommandType Application `
          -ErrorAction SilentlyContinue |
          Select-Object -First 1

        if ($linker) {
          $toolsetBinDir = Split-Path -Parent $linker.Source
          $asanDll = Join-Path $toolsetBinDir $asanDllName

          if (-not (Test-Path -LiteralPath $asanDll)) {
            throw "ASan DLL not found beside the active linker: $asanDll"
          }
        }
        else {
          # Fallback: locate the latest installed MSVC toolset.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'

          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere not found at $vswhere"
          }

          $installPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $installPath) {
            throw "No Visual Studio installation with VC tools found"
          }

          $toolsetRoot = Join-Path $installPath 'VC\Tools\MSVC'

          $toolset = Get-ChildItem -LiteralPath $toolsetRoot -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Where-Object {
              Test-Path -LiteralPath (
                Join-Path $_.FullName "bin\HostX64\x64\$asanDllName"
              )
            } |
            Select-Object -First 1

          if (-not $toolset) {
            throw "No compatible x64 ASan runtime found under $toolsetRoot"
          }

          $toolsetBinDir = Join-Path $toolset.FullName 'bin\HostX64\x64'
          $asanDll = Join-Path $toolsetBinDir $asanDllName

          # Make the selected toolset available to subsequent steps.
          Add-Content -Path $env:GITHUB_PATH -Value $toolsetBinDir
        }

        if (-not (Test-Path -LiteralPath $asanDll)) {
          throw "ASan runtime does not exist: $asanDll"
        }

        $asanDir = Split-Path -Parent $asanDll

        Add-Content -Path $env:GITHUB_PATH -Value $asanDir

        Write-Host "Using MSVC linker: $($linker.Source)"
        Write-Host "Using ASan runtime: $asanDll"

