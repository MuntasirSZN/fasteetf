name: Smoke-Test Fuzz Targets

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      FUZZ_TIME: 600
    strategy:
      matrix:
        include:
          - fuzz_target: parse
          - fuzz_target: parse_structured
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          channel: nightly
          bins: cargo-fuzz
      # Pin the GNU target: cargo-fuzz defaults to x86_64-unknown-linux-musl,
      # where ASan is incompatible with a statically linked libc (and the
      # musl std is not installed on the runner).
      - run: cargo fuzz build ${{ matrix.fuzz_target }} --target x86_64-unknown-linux-gnu
      - run: cargo fuzz run ${{ matrix.fuzz_target }} --target x86_64-unknown-linux-gnu -- -max_total_time=${{ env.FUZZ_TIME }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzzing-artifacts-${{ matrix.fuzz_target }}-${{ github.sha }}
          path: fuzz/artifacts
